name: loadtest (공통)

# 시나리오별 워크플로(loadtest-<시나리오>.yml)가 부르는 공통 실행이다. 직접 실행하지 않는다.
# 입력 확인(plan) → 승인(environment loadtest) → 사전 점검, 컨트롤러, 결과 정리, 뒷정리(run)
# 사전 점검부터 뒷정리까지 한 작업에 두는 까닭은 docs/design.md "실행"에 있다.
# GitHub 의 입력 화면은 조건부 입력이 없어서, 시나리오마다 쓰는 입력만 보이게 부르는 쪽을 나눴다.
# 입력은 모두 문자열이고, 비우면 시나리오 기본값이다. 뜻은 부르는 쪽의 입력 설명에 있다.
#
# 같은 시간에는 시험을 하나만 돌린다. concurrency 는 부르는 쪽에 둔다(여기에도 같은 그룹을 두면
# 부르는 실행이 그룹을 잡고 있어 GitHub 이 교착으로 보고 실행을 취소한다).
on:
  workflow_call:
    inputs:
      scenario:
        type: string
        required: true
      product_id:
        type: string
      prep_product_id:
        type: string
      open_at:
        type: string
      peak_rps:
        type: string
      duration:
        type: string
      ramp_up:
        type: string
      runners:
        type: string
      flows:
        type: string
      members:
        type: string
      admission_rps:
        type: string

permissions:
  contents: read

# 입력은 LT_<이름>으로 넘긴다. INPUT_ 으로 시작하는 이름은 Forgejo 러너(act)가 액션 입력으로 따로 다뤄
# ${{ }} 가 풀리지 않는다
env:
  AWS_REGION: ap-northeast-2
  LT_SCENARIO: ${{ inputs.scenario }}
  LT_PRODUCT_ID: ${{ inputs.product_id }}
  LT_PREP_PRODUCT_ID: ${{ inputs.prep_product_id }}
  LT_OPEN_AT: ${{ inputs.open_at }}
  LT_PEAK_RPS: ${{ inputs.peak_rps }}
  LT_DURATION: ${{ inputs.duration }}
  LT_RAMP_UP: ${{ inputs.ramp_up }}
  LT_RUNNERS: ${{ inputs.runners }}
  LT_FLOWS: ${{ inputs.flows }}
  LT_MEMBERS: ${{ inputs.members }}
  LT_ADMISSION_RPS: ${{ inputs.admission_rps }}

jobs:
  # 입력 확인. environment 없이 빌드 역할로 ECR 만 본다(main 조건)
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      test_id: ${{ steps.plan.outputs.test_id }}
      planned_at: ${{ steps.plan.outputs.planned_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: false

      - name: build
        # 모듈 받기가 네트워크 문제로 멈추면 작업이 끝까지 기다리지 않게 한다
        timeout-minutes: 10
        run: go build -o "$RUNNER_TEMP/gha" ./controller/cmd/gha

      # 로컬 Forgejo 에는 ECR 이 없어 이미지 확인을 건너뛴다
      - name: plan
        id: plan
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          CHECK_IMAGES: ${{ github.server_url == 'https://github.com' && '1' || '0' }}
        run: '"$RUNNER_TEMP/gha" plan'

  run:
    needs: plan
    runs-on: ubuntu-latest
    environment: loadtest
    # 작업 하나는 6시간까지 돈다. soak 는 4시간 안으로 잡는다
    timeout-minutes: 350
    permissions:
      contents: read
      id-token: write
    env:
      TEST_ID: ${{ needs.plan.outputs.test_id }}
      PLANNED_AT: ${{ needs.plan.outputs.planned_at }}
      AWS_ROLE_ARN: ${{ secrets.AWS_RUN_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: false

      - name: build
        # 모듈 받기가 네트워크 문제로 멈추면 작업이 끝까지 기다리지 않게 한다
        timeout-minutes: 10
        run: go build -o "$RUNNER_TEMP/gha" ./controller/cmd/gha

      # 로컬 Forgejo 에서는 컨테이너를 띄울 수 없어 컨트롤러를 작업 안에서 바로 돌린다(CONTROLLER_INLINE)
      - name: build controller (local)
        # 모듈 받기가 네트워크 문제로 멈추면 작업이 끝까지 기다리지 않게 한다
        timeout-minutes: 10
        if: github.server_url != 'https://github.com'
        run: |
          go build -o "$RUNNER_TEMP/controller" ./controller/cmd/controller
          echo "CONTROLLER_BIN=$RUNNER_TEMP/controller" >> "$GITHUB_ENV"

      # SSM 값 가리기, 사전 점검, 컨트롤러 실행과 대기, 결과 정리. 결과가 합격(stress 는 한계)이 아니면 실패한다
      - name: run
        env:
          BASE_URL: ${{ github.server_url == 'https://github.com' && 'https://api.grandis-nova.link' || vars.BASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: '"$RUNNER_TEMP/gha" run'

      # 실패하거나 취소돼도 시험 ID 의 태스크를 모두 멈추고 토큰을 지운다. 역할은 다시 맡는다
      - name: after
        if: always()
        run: '"$RUNNER_TEMP/gha" after'
