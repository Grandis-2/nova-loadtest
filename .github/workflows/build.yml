name: build

# main push: 이미지 3개를 커밋 해시 태그로 올리고, 시험 중이 아닐 때만 latest 를 옮긴다.
# loadtest 와 같은 동시 실행 그룹에 넣지 않는다(기다리던 실행이 밀려 취소된다. docs/design.md "인프라 값").
# 시험 중이라 실패했으면 시험이 끝난 뒤 수동으로 다시 돌린다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    # ECR 은 GitHub 에서만 쓴다
    if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [token-minter, k6, controller]
    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: ${{ secrets.AWS_BUILD_ROLE_ARN }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: false

      - name: build gha
        run: go build -o "$RUNNER_TEMP/gha" ./controller/cmd/gha

      # 레지스트리 주소에 계정 ID 가 있어 가리고, 뒤 단계에 REGISTRY 환경 변수로 넘긴다
      - name: ecr login
        run: '"$RUNNER_TEMP/gha" ecr-login'

      - name: push commit tag
        env:
          SHA: ${{ github.sha }}
        # 커밋 태그는 바꿀 수 없다(IMMUTABLE_WITH_EXCLUSION). latest 를 옮기려고 다시 돌리면 이미 있으므로 건너뛴다
        run: |
          ref="$REGISTRY/nova/loadtest-$IMAGE:$SHA"
          if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
            echo "커밋 태그가 이미 있다: $IMAGE:$SHA"
          else
            docker buildx build --platform linux/amd64 -f "$IMAGE/Dockerfile" -t "$ref" --push .
          fi

      - name: idle check
        env:
          LOADTEST_CLUSTER: nova-prod-loadtest
        run: '"$RUNNER_TEMP/gha" idle'

      - name: move latest
        env:
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create -t "$REGISTRY/nova/loadtest-$IMAGE:latest" "$REGISTRY/nova/loadtest-$IMAGE:$SHA"
