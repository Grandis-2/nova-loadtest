name: build

# main push: 이미지 3개를 커밋 해시 태그로 올리고, 시험 중이 아닐 때만 latest 를 옮긴다.
# loadtest 와 같은 동시 실행 그룹에 넣지 않는다(기다리던 실행이 밀려 취소된다. docs/design.md "인프라 값").
# 시험 중이라 실패했으면 시험이 끝난 뒤 수동으로 다시 돌린다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 빌드끼리는 한 번에 하나씩, push 순서대로 돈다. 기다리던 빌드는 더 새 push 에 밀려 취소되므로
# 오래된 커밋이 새 커밋의 latest 를 덮지 않는다
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-push:
    # ECR 은 GitHub 에서만 쓴다
    if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [token-minter, k6, controller]
    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: ${{ secrets.AWS_BUILD_ROLE_ARN }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: false

      - name: build gha
        # 모듈 받기가 네트워크 문제로 멈추면 작업이 끝까지 기다리지 않게 한다
        timeout-minutes: 10
        run: go build -o "$RUNNER_TEMP/gha" ./controller/cmd/gha

      # 레지스트리 주소에 계정 ID 가 있어 가리고, 뒤 단계에 REGISTRY 환경 변수로 넘긴다
      - name: ecr login
        run: '"$RUNNER_TEMP/gha" ecr-login'

      - name: push commit tag
        env:
          SHA: ${{ github.sha }}
        # 커밋 태그는 바꿀 수 없다(IMMUTABLE_WITH_EXCLUSION). latest 를 옮기려고 다시 돌리면 이미 있으므로 건너뛴다
        run: |
          ref="$REGISTRY/nova/loadtest-$IMAGE:$SHA"
          if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
            echo "커밋 태그가 이미 있다: $IMAGE:$SHA"
          else
            docker buildx build --platform linux/amd64 -f "$IMAGE/Dockerfile" -t "$ref" --push .
          fi

  # 세 이미지의 latest 를 한 작업에서 옮긴다. 이미지 하나라도 올리지 못했으면(needs) 옮기지 않는다
  promote:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: ${{ secrets.AWS_BUILD_ROLE_ARN }}
      LOADTEST_CLUSTER: nova-prod-loadtest
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: false

      - name: build gha
        # 모듈 받기가 네트워크 문제로 멈추면 작업이 끝까지 기다리지 않게 한다
        timeout-minutes: 10
        run: go build -o "$RUNNER_TEMP/gha" ./controller/cmd/gha

      # 지난 실행을 다시 돌려도 오래된 커밋으로 latest 를 되돌리지 않는다
      - name: main head
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" != "$SHA" ]; then
            echo "::error::$SHA 는 main 의 마지막 커밋($head)이 아니다. latest 를 옮기지 않는다"
            exit 1
          fi

      - name: ecr login
        run: '"$RUNNER_TEMP/gha" ecr-login'

      - name: idle check
        run: '"$RUNNER_TEMP/gha" idle'

      # 옮기는 데 몇 초 걸린다. 그 사이에 시험이 시작됐으면 이미지가 섞였을 수 있어 실패로 알린다
      - name: move latest
        run: |
          for image in token-minter k6 controller; do
            repo="$REGISTRY/nova/loadtest-$image"
            docker buildx imagetools create -t "$repo:latest" "$repo:$SHA"
          done
          "$RUNNER_TEMP/gha" idle || {
            echo "::error::latest 를 옮기는 동안 시험이 시작됐다. 컨트롤러와 k6 의 이미지가 다를 수 있으니 그 시험을 stop.yml 로 멈추고 다시 돌린다"
            exit 1
          }
