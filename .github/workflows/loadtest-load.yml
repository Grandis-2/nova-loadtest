name: loadtest load

# 평시의 몇 배까지 올렸다가 유지한다. WAF 예외가 있어야 돈다.
# 공통 실행은 _loadtest.yml 이다. 시나리오 설명은 위키 "시나리오-load"에 있다.
on:
  workflow_dispatch:
    inputs:
      flows:
        description: 돌릴 흐름(쉼표로 구분, catalog, preorders, entry, order, cancel). 상품 조회만이면 catalog. 비우면 다섯 흐름
      product_id:
        description: 진입할 시험 상품 ID. 진입(entry)에 필요하고, prep_product_id 를 비우면 조회, 결제, 취소의 준비 상품도 된다. flows=catalog 면 비운다
      prep_product_id:
        description: 준비 구간에 쓸 시험 상품 ID. 비우면 product_id
      open_at:
        description: 회차가 열리는 시각(RFC3339, 지금부터 1시간 안). 넣으면 본 시험을 이 시각에 시작한다. 비우면 바로 시작한다
      peak_rps:
        description: 흐름 시작 수 합계(초당). 비우면 기본 202
      duration:
        description: 유지 시간(예 10m). 비우면 기본 30m
      ramp_up:
        description: 올리는 시간(예 2m). 비우면 기본 1m
      runners:
        description: k6 태스크 대수. 비우면 계산한 값

# 모든 시나리오가 같은 그룹을 쓴다. 같은 시간에는 시험을 하나만 돌리고, 진행 중인 시험은 취소하지 않는다.
# 한 그룹에서 기다릴 수 있는 실행은 하나뿐이라 시험 중에 두 번 넘게 실행하면 앞서 기다리던 것이 취소된다(runbook).
concurrency:
  group: loadtest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  loadtest:
    # 공통 실행의 작업이 OIDC 로 역할을 맡는다. 부르는 쪽이 준 권한보다 넓힐 수 없다
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_loadtest.yml
    # 빌드 역할 ARN 은 저장소 비밀이다. 실행 역할 ARN 과 Slack 주소는 공통 실행의 run 작업이 environment loadtest 에서 읽는다
    secrets: inherit
    with:
      scenario: load
      flows: ${{ inputs.flows }}
      product_id: ${{ inputs.product_id }}
      prep_product_id: ${{ inputs.prep_product_id }}
      open_at: ${{ inputs.open_at }}
      peak_rps: ${{ inputs.peak_rps }}
      duration: ${{ inputs.duration }}
      ramp_up: ${{ inputs.ramp_up }}
      runners: ${{ inputs.runners }}
