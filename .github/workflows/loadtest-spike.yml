name: loadtest spike

# 판매 오픈 순간의 몰림. 10초 동안 peak_rps 명씩 진입하고, 그 뒤 duration 동안 줄과 큐가 빠지는 것을 본다.
# 공통 실행은 _loadtest.yml 이다. 시나리오 설명은 위키 "시나리오-spike"에 있다.
on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 진입할 시험 상품 ID
        required: true
      prep_product_id:
        description: 준비 구간에 쓸 시험 상품 ID. open_at 을 넣으면 따로 넣는다. 비우면 product_id
      open_at:
        description: 판매가 열리는 시각(RFC3339, 지금부터 1시간 안). 비우면 이미 열린 상품으로 보고 준비 구간 뒤 바로 몰린다
      peak_rps:
        description: 몰림의 초당 진입 수. 비우면 기본 500
      duration:
        description: 몰림 뒤 관찰 시간(예 30m). 비우면 기본 10m
      runners:
        description: k6 태스크 대수. 비우면 계산한 값
      flows:
        description: 돌릴 흐름(쉼표로 구분, catalog, preorders, entry, order, cancel). entry 가 있어야 한다. 비우면 다섯 흐름
      abort_error_rate:
        description: 중단할 오류율(%, 0보다 크고 50 이하. 5 는 5%). 비우면 기본 5

# 모든 시나리오가 같은 그룹을 쓴다. 같은 시간에는 시험을 하나만 돌리고, 진행 중인 시험은 취소하지 않는다.
# 한 그룹에서 기다릴 수 있는 실행은 하나뿐이라 시험 중에 두 번 넘게 실행하면 앞서 기다리던 것이 취소된다(runbook).
concurrency:
  group: loadtest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  loadtest:
    # 공통 실행의 작업이 OIDC 로 역할을 맡는다. 부르는 쪽이 준 권한보다 넓힐 수 없다
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_loadtest.yml
    # 빌드 역할 ARN 은 저장소 비밀이다. 실행 역할 ARN 과 Slack 주소는 공통 실행의 run 작업이 environment loadtest 에서 읽는다
    secrets: inherit
    with:
      scenario: spike
      product_id: ${{ inputs.product_id }}
      prep_product_id: ${{ inputs.prep_product_id }}
      open_at: ${{ inputs.open_at }}
      peak_rps: ${{ inputs.peak_rps }}
      duration: ${{ inputs.duration }}
      runners: ${{ inputs.runners }}
      flows: ${{ inputs.flows }}
      abort_error_rate: ${{ inputs.abort_error_rate }}
