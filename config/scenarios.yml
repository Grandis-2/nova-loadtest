# 부하 시험 설정. 계획 계산(controller/cmd/plan), 컨트롤러, 토큰 발급기가 이 파일을 읽는다.
# 토큰 발급기는 빌드할 때 이 파일을 실행 파일에 넣는다. 그래서 members 범위는 실행 중에 바꿀 수 없다.
# 설명은 docs/implementation-plan.md 2.1, 근거는 docs/design.md 에 있다.
# "추정"이라고 적은 값은 smoke 와 load 에서 실측한 뒤 고친다(C-5).

# 흐름. weight 는 평시 초당 흐름 시작 수(breakscale 01-평시, 합계 101).
# requests 는 WAF 요청 제한에 세는 요청 수, queue_requests 는 대기열 경로(제한에서 빠짐)의 요청 수다.
# iteration_seconds 는 흐름 하나가 VU 를 잡는 시간(추정)이다.
flows:
  catalog:
    weight: 80
    pool: none
    requests: 7.94         # catalog_paths 로 계산한 평균(설정 검사가 맞춰 본다)
    iteration_seconds: 2
  preorders:
    weight: 10
    pool: b
    requests: 2            # 예약 목록(size 100), 예약 상세. 화면은 /active 를 부르지 않는다
    iteration_seconds: 1
  entry:
    weight: 5
    pool: a
    requests: 7            # 사전예약 상세와 배송 차수, 입장 뒤 상품 상세와 배송 차수, 접수, 등록 확인 두 번(추정, 최대 5)
    admitted_requests: 5   # requests 중 입장한 뒤의 요청. 몰릴 때는 입장 속도를 넘지 않는다
    register_requests: 2   # requests 중 등록 확인(1초마다). 준비 구간은 따로 기다리므로(register_wait) 보내지 않는다
    queue_requests: 2      # 진입, 순번 확인 한 번(줄이 없을 때)
    iteration_seconds: 5   # 등록 확인을 1초마다 기다린다
  order:
    weight: 5
    pool: b
    requests: 3            # 예약 찾기, 주문, 결제 시도
    iteration_seconds: 1
  cancel:
    weight: 1
    pool: c
    requests: 2            # 예약 찾기, 취소
    iteration_seconds: 1

# 상품 조회 흐름의 화면 이동(프론트 fe 의 화면 기준). 비율은 추정이고 RUM(Faro) 실측으로 고친다
# 홈: 인기 상품(size 10), 카테고리 트리, 대분류 줄마다 목록(기본 size 20)
# 카테고리 목록과 검색 결과는 size 12, 검색창은 size 8. 정렬(sort)은 화면이 보내지 않아 쓰지 않는다
# 상품을 누르면 상세와 함께 사전예약은 배송 차수(preorder), 일반 판매는 리뷰(size 100)를 부른다
# 사전예약 메뉴는 사전예약 목록 → 사전예약 상세(첫 상품의 배송 차수)에서 끝난다. 사전예약 상품은 이 메뉴로만 찾는다
catalog_paths:
  home_rows: 3             # 모바일, PC/주변기기, 웨어러블
  category: 0.5
  search: 0.3              # 검색창(size 8) → 검색 결과(size 12)
  preorder: 0.15           # 사전예약 목록 → 사전예약 상세
  next_page: 0.3
  max_pages: 3
  click: 0.7

# 대기열
admission_rps: 150         # 입장 속도(AdmissionProperties globalCredit)
entry_cap_rps: 120         # 진입 상한. 입장 속도의 80%
poll_interval_seconds: 2   # 줄에 선 회원의 평균 확인 간격(추정. 서버는 1, 3, 10, 30초를 준다)

# WAF 예외 없이 도는 시나리오의 IP(태스크)당 5분 요청 상한. 제한 3,000 의 80%
waf_limit_per_5m: 2400

scenarios:
  smoke:
    shape: constant
    peak_rps: 2.2          # WAF 예외 없이 2분을 돌 수 있는 크기(상품 조회 흐름 하나가 약 7.9건이고 준비 구간 요청이 더해진다)
    duration: 2m
    max_rps: 20
    max_duration: 10m
    max_vus: 500
    waf_exempt: false
    pool_b: 50
  load:
    shape: ramping
    peak_rps: 202          # 평시 × 2
    duration: 30m
    ramp_up: 1m
    max_rps: 2000
    max_duration: 2h
    max_vus: 10000
    waf_exempt: true
    pool_b: 1000
  spike:
    shape: spike
    peak_rps: 500          # 몰림의 초당 진입 수
    duration: 10m          # 몰림 뒤 관찰 시간
    burst_seconds: 10
    observe_entry_rps: 5   # 관찰 구간의 진입(평시)
    background:            # breakscale 02 의 배경 트래픽에서 로그인을 뺀 것
      catalog: 200
      preorders: 30
      order: 10
      cancel: 1
    max_rps: 2000
    max_duration: 1h
    max_vus: 15000
    waf_exempt: true
    pool_b: 1000
  rush:
    shape: rush            # 몰린 회원이 줄을 지나 접수하고, 등록 알림을 받아 주문과 결제 시도까지 간다
    peak_rps: 500          # 몰림의 초당 진입 수(spike 와 같게 두어 비교한다)
    duration: 10m          # 몰림 뒤 관찰 시간. 알림 대기 상한보다 길어야 한다
    burst_seconds: 10
    background:            # 준비 구간이 없어 회원이 필요 없는 상품 조회만 둔다
      catalog: 200
    rush:
      pay_ratio: 0.5       # 바로 결제하는 회원. 나머지는 접수만 하고 떠난다(24시간 안에 나중에 결제)
      # 안 읽은 알림 수 확인 간격. 화면의 실시간 연결(SSE) 대신 조회로 흉내 낸다. 결제할 2,500명이 함께 기다리면
      # member(1대)에 초당 250건이 간다. 더 줄이면 실제에 없는 조회가 알림 저장까지 늦출 수 있다
      notify_interval: 10s
      # 넘으면 notify_timeout 으로 세고 결제를 건너뛴다. member 의 알림 저장은 태스크당 초당 약 20건(nova-infra
      # member application.yml)이라 5,000건이면 약 4분, 등록 큐가 비는 약 90초를 더해 마지막 알림은 오픈 뒤 약 6분이다
      notify_timeout: 8m
    max_rps: 2000
    max_duration: 1h
    max_vus: 15000
    waf_exempt: true
  queue:
    # 입력한 인원이 한 번씩 진입해 Retry-After 간격으로 기다리고, 입장하면 접수와 등록 확인까지 간다.
    # 모두 처리되면 끝나고, duration 은 처리 기한이다. 배경 트래픽과 준비 구간이 없다
    shape: queue
    peak_rps: 500          # 초당 진입 수. 인원 ÷ 이 값이 도착 시간이다
    members: 5000          # 입력 members 의 기본값
    max_members: 99980     # 시험 회원 10만 명에서 풀 A 여유(max_tasks)를 뺀 수
    deadline_margin: 3m    # duration 을 비우면 최소 처리 시간(입장 속도로 모두 들이는 시간 + 접수)에 이만큼 더한다
    max_rps: 2000
    max_duration: 30m
    max_vus: 10000         # 동시 인원(줄에 선 회원 + 입장 뒤 접수 중인 회원)의 상한. 회원 한 명이 VU 하나를 잡는다
    waf_exempt: true
  stress:
    shape: step
    peak_rps: 808          # 평시 × 8 (마지막 단계)
    steps: [1, 2, 4, 6, 8] # 평시의 배수
    step_duration: 5m
    max_rps: 2000
    max_duration: 2h
    max_vus: 15000
    waf_exempt: true
    pool_b: 1000
  soak:
    shape: constant
    peak_rps: 101          # 평시 × 1
    duration: 4h
    max_rps: 500
    max_duration: 6h
    max_vus: 10000
    waf_exempt: true
    pool_b: 1000

runner:
  requests_per_task: 1000  # 태스크당 초당 요청(추정)
  vu_memory_mb: 5          # VU 하나의 메모리(추정)
  task_memory_mb: 8192
  headroom: 0.3            # 목표보다 30% 여유
  vu_burst_factor: 1.5     # maxVUs = 예상 VU × 이 값
  max_tasks: 20            # Fargate vCPU 할당량에서 운영 사용분을 뺀 값. 정할 것
  start_delay: 2m          # 컨트롤러가 START_AT 을 지금 + 이 시간으로 잡는다
  entry_graceful_stop: 3m  # 줄에 선 회원이 잘리지 않게
  job_limit: 6h            # GitHub Actions 작업 하나의 상한
  max_open_at_lead: 1h     # open_at 은 지금부터 이 시간 안이어야 한다. 이 대기를 토큰 유효 시간과 작업 시간에 넣는다

members:
  start: 1                 # 시험 회원 번호. id = 10ad7e57-0000-7000-8000-<12자리 번호>
  count: 100000
  prep_rps: 100            # 준비 구간 속도
  register_wait: 2m        # 준비한 예약이 REGISTERED 가 될 때까지
  token_margin: 30m        # 토큰 유효 시간 = 시험 시간 + 이 값
  max_token_ttl: 6h30m

# 시계열 수 계산(시험 하나, Mimir 한도를 지키려고 2만 개 이하로 둔다)
series:
  limit: 20000
  names: 17                # tags.name × method 조합(템플릿 15개, 대기열과 예약 목록은 GET, POST 둘)
  statuses_per_name: 3     # 추정
  histogram: 18            # 경계 15 + +Inf 버킷 = 16, 합, 개수
  counters_per_name: 2     # http_reqs, http_req_failed
  extra_per_task: 60       # entry_to_accept, vus, iterations, error_code 등

slo:
  p95_ms: 500
  max_5xx_rate: 0.001
  abort_error_rate: 5      # %, 입력 abort_error_rate 의 기본값
  abort_5xx_rate: 1        # %
  abort_after: 1m

cleanup:
  # 정리 전에 비어야 하는 큐. 이름만 두고 계정 ID 는 넣지 않는다. 컨트롤러 역할은 이 네 큐만 볼 수 있다
  # (nova-infra 시험 스택 iam.tf 의 watched_queues)
  queues:
    - preorder-register
    - preorder-cancel
    - preorder-events
    - order-events
  max_wait: 30m

# Mimir 의 지표 이름과 라벨. smoke(C-2)에서 확정한 값으로 고친다
metrics:
  job: loadtest/k6
  instance_label: instance
  duration: k6_http_req_duration_milliseconds
  reqs: k6_http_reqs_total
  vus: k6_vus
  outcomes: k6_entry_outcome_total   # 진입 흐름의 결과(entry.js entry_outcome, 라벨 outcome)
  le_500: "500"
