# 로컬 확인용 Forgejo 와 러너. 운영에 쓰지 않는다(구현 계획 7절).
# 띄우는 법은 local/README.md. 3단계 각본(moto, fake-cluster, fake-api)은 local/scenarios 가 돌린다.
name: nova-loadtest-local

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.0
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      # 작업 컨테이너가 이 주소로 checkout 한다
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"
      FORGEJO__actions__ENABLED: "true"
      # uses: 가 GitHub 과 같은 액션을 받는다
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://github.com
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 3s
      retries: 40

  # 러너가 쓰는 Docker. 호스트의 Docker 소켓은 넘기지 않는다
  dind:
    image: docker:29.7.2-dind
    privileged: true
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 2s
      retries: 30

  runner:
    image: code.forgejo.org/forgejo/runner:13.2.0
    depends_on:
      forgejo:
        condition: service_healthy
      dind:
        condition: service_healthy
    user: "0:0"
    environment:
      DOCKER_HOST: tcp://dind:2375
    # RUNNER_TOKEN. forgejo/up.sh 가 Forgejo 에서 받아 둔다
    env_file:
      - path: .data/runner.env
        required: false
    working_dir: /data
    volumes:
      - runner-data:/data
      - ./forgejo/runner.yml:/config/runner.yml:ro
    command:
      - sh
      - -ec
      - |
        [ -f .runner ] || forgejo-runner register --no-interactive \
          --instance http://forgejo:3000 --name local --token "$$RUNNER_TOKEN"
        exec forgejo-runner --config /config/runner.yml daemon

  # S3, SSM, SQS 흉내. 실행기가 결과를 읽도록 127.0.0.1 에만 연다
  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:5000:5000"

  # 가짜 ECS(:8080)와 가짜 Mimir(:9009). 각본 제어(:8081)는 127.0.0.1 에만 연다
  fake-cluster:
    build:
      context: ..
      dockerfile: local/fakes.Dockerfile
    entrypoint: ["/fake-cluster"]
    depends_on: [moto]
    environment:
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:8081:8081"

  # 사전 점검이 부르는 공개 상품 API(vars.BASE_URL)
  fake-api:
    build:
      context: ..
      dockerfile: local/fakes.Dockerfile
    entrypoint: ["/fake-api"]

volumes:
  forgejo-data:
  dind-data:
  runner-data:
