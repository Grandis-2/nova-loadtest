# forgejo-runner 설정. 작업 컨테이너는 dind 안에서 뜬다.
log:
  level: info

runner:
  file: .runner
  # 시험이 도는 동안 stop.yml 이 돌 수 있게 둘로 둔다(시험 워크플로는 concurrency 로 하나만 돈다)
  capacity: 2
  timeout: 1h
  # 기본 이미지는 Debian + node 정도다. jq, AWS CLI 같은 도구에 기대지 않는다(구현 계획 7.3)
  labels:
    - "ubuntu-latest:docker://node:24.19.0-bookworm"
  # 작업이 실제 AWS 대신 moto 와 fake-cluster 를 보게 한다. 값은 모두 가짜다(구현 계획 7.4).
  # cmd/gha 는 GitHub 이 아니면 이 두 주소가 로컬인지 확인하고, 컨트롤러를 작업 안에서 바로 돌린다
  envs:
    AWS_ENDPOINT_URL: http://moto:5000
    AWS_ENDPOINT_URL_ECS: http://fake-cluster:8080
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    CONTROLLER_INLINE: "1"

cache:
  enabled: false

container:
  # dind 의 네트워크를 같이 써서 작업이 compose 안의 forgejo 에 닿는다
  network: host
  privileged: false
  # 작업 컨테이너에 Docker 소켓을 넣지 않는다
  docker_host: "-"
  # setup-go 가 받은 Go 와 Go 모듈을 dind 의 볼륨에 남겨, 다음 실행부터는 다시 받지 않는다
  options: -v nova-loadtest-toolcache:/opt/hostedtoolcache -v nova-loadtest-gomod:/root/go/pkg/mod
  valid_volumes:
    - nova-loadtest-toolcache
    - nova-loadtest-gomod
